[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omnivoice"
version = "0.1.0"
description = "A local bilingual voice assistant for Apple Silicon, powered by Qwen3-Omni and MiniCPM-o on MLX."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "OmniVoice contributors" }]
keywords = ["mlx", "voice-assistant", "qwen3-omni", "minicpm-o", "speech", "apple-silicon"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "soundfile>=0.12",
  "huggingface-hub>=0.24",
]

[project.optional-dependencies]
mlx = [
  "mlx>=0.18",
  "mlx-vlm>=0.7.12",
  "mlx-whisper>=0.4.3",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.7",
]

[project.scripts]
omnivoice = "omnivoice.__main__:main"

[tool.setuptools]
packages = ["omnivoice"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["models", ".venv", "web"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI uses File(...)/Form(...) in signature defaults by design.
"omnivoice/server.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["omnivoice"]
omit = ["omnivoice/server.py", "omnivoice/qwen_omni.py", "omnivoice/minicpm_omni.py"]
